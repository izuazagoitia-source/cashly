<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashly — Inicia sesión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --verde:#1B4F3A;--verde2:#2D7A58;--verde-claro:#E8F3ED;
    --gris:#F7F5F0;--borde:#E2DDD5;--text:#1A1814;--text2:#6B665E;
    --danger:#C0392B;--font:'Inter',system-ui,sans-serif
  }
  body{font-family:var(--font);background:var(--gris);min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:20px}

  .card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;
        box-shadow:0 4px 32px rgba(0,0,0,.08)}

  .logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:center}
  .logo-icon{font-size:32px}
  .logo-text{font-size:22px;font-weight:700;color:var(--verde)}
  .logo-sub{font-size:11px;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}

  h2{font-size:20px;font-weight:600;color:var(--text);margin-bottom:6px;text-align:center}
  .subtitle{font-size:13px;color:var(--text2);text-align:center;margin-bottom:28px}

  /* Tabs login/registro */
  .tabs{display:flex;background:var(--gris);border-radius:10px;padding:4px;margin-bottom:24px}
  .tab-btn{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;
           font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;font-family:var(--font)}
  .tab-btn.active{background:#fff;color:var(--verde);box-shadow:0 1px 4px rgba(0,0,0,.08)}

  /* Google */
  .btn-google{width:100%;padding:12px;border:1.5px solid var(--borde);border-radius:10px;
              background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;
              font-size:14px;font-weight:500;color:var(--text);cursor:pointer;margin-bottom:20px;
              transition:all .15s;font-family:var(--font)}
  .btn-google:hover{border-color:#aaa;background:var(--gris)}
  .google-icon{width:20px;height:20px}

  .divider{display:flex;align-items:center;gap:12px;margin-bottom:20px;color:var(--text2);font-size:12px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--borde)}

  /* Inputs */
  .field{margin-bottom:16px}
  label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px}
  input{width:100%;padding:11px 14px;border:1.5px solid var(--borde);border-radius:10px;
        font-size:14px;font-family:var(--font);color:var(--text);outline:none;transition:.15s}
  input:focus{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(45,122,88,.1)}
  input::placeholder{color:#bbb}

  .btn-primary{width:100%;padding:13px;background:var(--verde);color:#fff;border:none;
               border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
               font-family:var(--font);transition:.15s;margin-top:4px}
  .btn-primary:hover{background:var(--verde2)}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}

  .error{background:#FEF2F2;border:1px solid #FCA5A5;color:var(--danger);
         padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
  .success{background:var(--verde-claro);border:1px solid #86EFAC;color:var(--verde);
           padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}

  .footer{text-align:center;margin-top:24px;font-size:12px;color:var(--text2)}

  .loading{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);
           border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">💰</div>
    <div>
      <div class="logo-text">Cashly</div>
      <div class="logo-sub">Finanzas personales</div>
    </div>
  </div>

  <h2 id="card-title">Bienvenido</h2>
  <p class="subtitle" id="card-sub">Gestiona tu patrimonio personal</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('login')" id="tab-login">Iniciar sesión</button>
    <button class="tab-btn" onclick="setTab('register')" id="tab-register">Registrarse</button>
  </div>

  <div id="msg-error" class="error"></div>
  <div id="msg-success" class="success"></div>

  <!-- Google -->
  <button class="btn-google" onclick="loginGoogle()">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continuar con Google
  </button>

  <div class="divider">o con email</div>

  <form id="auth-form" onsubmit="submitForm(event)">
    <div class="field" id="field-name" style="display:none">
      <label>Nombre completo</label>
      <input type="text" id="inp-name" placeholder="Juan Castro" autocomplete="name">
    </div>
    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="inp-email" placeholder="juan@ejemplo.com" required autocomplete="email">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="inp-pass" placeholder="Mínimo 6 caracteres" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-primary" id="btn-submit">Iniciar sesión</button>
  </form>

  <div class="footer">
    Al registrarte aceptas los <a href="#" style="color:var(--verde)">Términos de uso</a><br>
    Tus datos están protegidos con cifrado de extremo a extremo
  </div>
</div>

<script>
  // ── SUPABASE CONFIG ──
  const SUPABASE_URL  = 'https://zymvblvsuaeeslajgvgo.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5bXZibHZzdWFlZXNsYWpndmdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjM3MTYsImV4cCI6MjEwMTQzOTcxNn0.fyV1QPKAlryo-OOeGAvmkwjh1X93UgTrZzY4hl6subM';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

  let currentTab = 'login';

  function setTab(tab) {
    currentTab = tab;
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('field-name').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('btn-submit').textContent = tab === 'login' ? 'Iniciar sesión' : 'Crear cuenta';
    document.getElementById('card-title').textContent = tab === 'login' ? 'Bienvenido' : 'Crear cuenta';
    document.getElementById('card-sub').textContent = tab === 'login' ? 'Gestiona tu patrimonio personal' : 'Empieza a controlar tus finanzas';
    clearMsgs();
    // Fix autocomplete
    document.getElementById('inp-pass').autocomplete = tab === 'login' ? 'current-password' : 'new-password';
  }

  function showError(msg) {
    const el = document.getElementById('msg-error');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('msg-success').style.display = 'none';
  }
  function showSuccess(msg) {
    const el = document.getElementById('msg-success');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('msg-error').style.display = 'none';
  }
  function clearMsgs() {
    document.getElementById('msg-error').style.display = 'none';
    document.getElementById('msg-success').style.display = 'none';
  }

  function setLoading(loading) {
    const btn = document.getElementById('btn-submit');
    btn.disabled = loading;
    btn.innerHTML = loading
      ? '<span class="loading"></span>Procesando...'
      : (currentTab === 'login' ? 'Iniciar sesión' : 'Crear cuenta');
  }

  async function submitForm(e) {
    e.preventDefault();
    clearMsgs();
    setLoading(true);

    const email = document.getElementById('inp-email').value.trim();
    const pass  = document.getElementById('inp-pass').value;
    const name  = document.getElementById('inp-name').value.trim();

    if (currentTab === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) { showError('Correo o contraseña incorrectos'); setLoading(false); return; }
      window.location.href = '/';
    } else {
      if (pass.length < 6) { showError('La contraseña debe tener al menos 6 caracteres'); setLoading(false); return; }
      const { data, error } = await sb.auth.signUp({
        email, password: pass,
        options: { data: { full_name: name || email.split('@')[0] } }
      });
      if (error) { showError(error.message); setLoading(false); return; }
      showSuccess('✓ Cuenta creada. Revisa tu correo para confirmar y luego inicia sesión.');
      setTab('login');
    }
    setLoading(false);
  }

  async function loginGoogle() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/' }
    });
    if (error) showError(error.message);
  }

  // Verificar si ya hay sesión activa
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = '/';
  });
</script>
</body>
</html>
